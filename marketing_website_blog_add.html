<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Blog — TimeERP Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/marketing-website-blog-add.css?v=1">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="mwba-top-checkout" id="crmTopCheckOutBtn">Check Out</button>
            <time class="mwba-top-clock" id="mwbaTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn mwba-top-icon" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn mwba-top-icon" id="notifBtn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile">
                <span class="topbar__avatar">CA</span>
                <span class="topbar__profile-meta"><strong>CA CloudDesk</strong><span>Admin</span></span>
                <svg class="mwba-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="marketing_website_blogs.html" class="dropdown__item"><strong>Blogs</strong><span>Back to blogs list</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="mwba-page">
          <header class="mwba-header">
            <a class="mwba-back" href="marketing_website_blogs.html" aria-label="Back to Blogs">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <span class="mwba-crumb">Blogs</span>
          </header>

          <div class="mwba-panel">
            <h1 class="mwba-title">Add Blog</h1>
            <form class="mwba-form" id="mwbaForm">
              <div class="mwba-field"><label>Title<span class="mwba-req">*</span></label><input type="text" id="mwbaTitle" required></div>
              <div class="mwba-field"><label>Content</label>
                <div class="mwba-rte">
                  <div class="mwba-rte__bar">
                    <button type="button" data-cmd="undo">↶</button>
                    <button type="button" data-cmd="redo">↷</button>
                    <select class="mwba-rte__fmt"><option>Paragraph</option><option>Heading 1</option><option>Heading 2</option></select>
                    <button type="button" data-cmd="bold"><b>B</b></button>
                    <button type="button" data-cmd="italic"><i>I</i></button>
                    <button type="button" data-cmd="foreColor">A</button>
                    <button type="button">☺</button>
                    <button type="button">&lt;&gt;</button>
                    <button type="button" data-cmd="justifyLeft">≡</button>
                    <button type="button" data-cmd="justifyCenter">≡</button>
                    <button type="button" data-cmd="justifyRight">≡</button>
                    <button type="button" data-cmd="insertUnorderedList">•</button>
                    <button type="button" data-cmd="insertOrderedList">1.</button>
                    <button type="button">▦</button>
                  </div>
                  <div class="mwba-rte__area" id="mwbaContent" contenteditable="true"></div>
                  <div class="mwba-rte__foot"><span>p</span><span id="mwbaWordCount">0 words</span></div>
                </div>
              </div>
              <div class="mwba-field"><label>Slug<span class="mwba-req">*</span></label><input type="text" id="mwbaSlug" required></div>
              <div class="mwba-field"><label>Short Description</label><textarea id="mwbaShortDesc" rows="3"></textarea></div>
              <div class="mwba-field"><label>Image</label>
                <button type="button" class="mwba-upload" id="mwbaUploadBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V8"/><path d="M8 12l4-4 4 4"/><path d="M4 20h16"/></svg><span>Click to Upload</span></button>
                <input type="file" id="mwbaImage" accept="image/*" hidden>
              </div>
              <div class="mwba-field mwba-field--row">
                <label>Is Trending</label>
                <label class="mwba-toggle"><input type="checkbox" id="mwbaTrending"><span class="mwba-toggle__track"><span class="mwba-toggle__thumb"></span></span></label>
              </div>
              <div class="mwba-field"><label>Category</label>
                <select class="mwba-select" id="mwbaCategory"><option value="">Select a category</option></select>
              </div>
              <div class="mwba-field"><label>Tags</label>
                <span class="mwba-combo" id="mwbaTagsCombo">
                  <input type="text" id="mwbaTagsInput" placeholder="Select Tags" autocomplete="off">
                  <div class="mwba-combo__menu" id="mwbaTagsMenu"></div>
                </span>
                <div class="mwba-tags" id="mwbaTagsList"></div>
              </div>
              <button type="submit" class="mwba-save">Save</button>
            </form>
          </div>

          <footer class="mwba-app-footer" aria-label="App footer"></footer>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/marketing-website-blog-add.js?v=1"></script>
</body>
</html>
