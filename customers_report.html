<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers Report — TimeERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/customers-report.css?v=3">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="dv-top-checkout" id="crmTopCheckOutBtn">Check Out</button>
            <time class="dv-top-clock" id="dvTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn dv-top-icon" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn dv-top-icon" id="notifBtn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile">
                <span class="topbar__avatar">CA</span>
                <span class="topbar__profile-meta"><strong>CA CloudDesk</strong><span>Admin</span></span>
                <svg class="dv-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="home.html" class="dropdown__item"><strong>Dashboard</strong><span>Back to home</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="cr-page">
          <div class="cr-back-row">
            <a class="cr-back" href="home.html#reports" aria-label="Back to Reports">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <span class="cr-back-title">Customers Report</span>
          </div>

          <section class="cr-card" id="crFilterCard" aria-labelledby="crTitle">
            <div class="cr-card__head">
              <h1 class="cr-card__title" id="crTitle">Customers Report</h1>
              <select class="cr-type-select" id="crReportType" aria-label="Report type">
                <option selected>Monthly New Customer</option>
                <option>Customer Status</option>
                <option>Customer Interaction</option>
                <option>Customer Detailed</option>
                <option>Deleted Report</option>
                <option>Customer Profit Loss</option>
                <option>Customer Expense Effort</option>
                <option>All Feedback</option>
              </select>
              <button type="button" class="cr-collapse" id="crCollapseBtn" aria-expanded="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                Collapse
              </button>
            </div>

            <div class="cr-filters">
              <div class="cr-field">
                <label for="crMonthRange">Month</label>
                <div class="cr-month-wrap" id="crMonthWrap">
                  <input type="text" id="crMonthRange" value="Jul-2026 → Jul-2026" readonly aria-haspopup="dialog" aria-expanded="false">
                  <svg class="cr-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                  <div class="cr-monthpicker" id="crMonthpicker" hidden role="dialog" aria-label="Choose month range">
                    <div class="cr-monthpicker__panels">
                      <div class="cr-month-panel">
                        <div class="cr-month-panel__head">
                          <button type="button" data-nav="prev-year" aria-label="Previous year">&lt;&lt;</button>
                          <span class="cr-month-panel__label" id="crYearLeft">2026</span>
                        </div>
                        <div class="cr-month-grid" id="crMonthLeft"></div>
                      </div>
                      <div class="cr-month-panel">
                        <div class="cr-month-panel__head">
                          <span class="cr-month-panel__label" id="crYearRight">2027</span>
                          <button type="button" data-nav="next-year" aria-label="Next year">&gt;&gt;</button>
                        </div>
                        <div class="cr-month-grid" id="crMonthRight"></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="cr-generate">
              <button type="button" class="cr-btn" id="crGenerateBtn">Generate Report</button>
            </div>
          </section>

          <section class="cr-card cr-result is-visible" id="crResult" aria-label="Customers report results">
            <div class="cr-chart-wrap">
              <div class="cr-chart" role="img" aria-label="Monthly new customers chart">
                <div class="cr-chart__y" aria-hidden="true">
                  <span>2</span><span>1.5</span><span>1</span><span>0.5</span><span>0</span>
                </div>
                <div class="cr-chart__plot">
                  <div class="cr-chart__grid" aria-hidden="true"></div>
                  <div class="cr-bars" id="crBars"></div>
                </div>
              </div>
            </div>

            <div class="cr-summary-row">
              <span>Total Count : <strong>12</strong></span>
              <button type="button" class="cr-excel" id="crExcelBtn" title="Export Excel">
                <svg viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.7"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9.2 12.2l5.6 5.6M14.8 12.2l-5.6 5.6"/></svg>
                EXCEL
              </button>
            </div>

            <div class="cr-table-wrap">
              <table class="cr-table" id="crDataTable">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Count</th>
                    <th>Deleted Count</th>
                  </tr>
                </thead>
                <tbody id="crTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/customers-report.js?v=1"></script>
</body>
</html>
