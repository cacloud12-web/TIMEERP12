<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | TimeERP</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico?v=13" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #25b7a7;
      --primary-dark: #1a9e8f;
      --heading: #083530;
      --muted: #7a9593;
      --bg: #f8fcfc;
      --border: #d0eeec;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #3d5250;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37, 183, 167, 0.18), transparent 55%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .box {
      width: min(480px, 100%);
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 28px;
      box-shadow: 0 20px 60px rgba(36, 63, 100, 0.08);
    }
    .code {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.35rem;
      color: var(--heading);
      margin-bottom: 10px;
    }
    p {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    a:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #17c3b2);
      color: #fff;
      box-shadow: 0 10px 24px rgba(37, 183, 167, 0.3);
    }
    .btn-ghost {
      background: #fff;
      color: var(--heading);
      border: 1.5px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary-dark); }
  </style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>This page is not available</h1>
    <p>The link may be outdated or the page was moved. Go back to TimeERP home or explore our product modules.</p>
    <div class="actions">
      <a class="btn-primary" href="/">Go to home</a>
      <a class="btn-ghost" href="/home.html">Open module hub</a>
      <a class="btn-ghost" href="/contact_sales.html">Contact sales</a>
    </div>
  </main>
  <script src="js/site-footer.js?v=6"></script>
</body>
</html>
