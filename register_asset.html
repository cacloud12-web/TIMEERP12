<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Assets — TimeERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/register-asset.css?v=2">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand"><a href="home.html" class="sidebar__brand-logo"><img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48"></a></div>
      <div class="sidebar__toolbar" role="group"><button type="button" class="sidebar__search-btn" id="sidebarSearchToggle"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button type="button" class="sidebar__create-btn" id="sidebarCreate"><span class="sidebar__create-icon">+</span><span>Create</span></button></div>
      <nav class="sidebar__nav" id="sidebarList"></nav>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle">☰</button>
          <div class="topbar__search" role="search"><input type="search" id="globalSearch" placeholder="Search..." autocomplete="off"></div>
          <div class="topbar__actions">
            <button type="button" class="ra-top-checkout" id="crmTopCheckOutBtn">Check Out</button>
            <time class="ra-top-clock" id="raTopClock">--:--</time>
            <button type="button" class="topbar__icon-btn ra-top-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></button>
            <div class="topbar__menu" style="position:relative"><button type="button" class="topbar__icon-btn ra-top-icon" id="notifBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg></button><div class="dropdown" id="notifDropdown" role="menu"><div class="dropdown__title">Notifications</div><div id="notifList"></div></div></div>
            <div class="topbar__menu" style="position:relative"><button type="button" class="topbar__profile" id="profileBtn"><span class="topbar__avatar">CA</span><span class="topbar__profile-meta"><strong>CA CloudDesk</strong><span>Admin</span></span><svg class="ra-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button><div class="dropdown" id="profileDropdown" role="menu"><div class="dropdown__title">Account</div><a href="home.html" class="dropdown__item"><strong>Dashboard</strong><span>Back to home</span></a></div></div>
          </div>
        </div>
      </header>
      <main class="main">
        <div class="ra-page">
          <div class="ra-header">
            <a class="ra-back" href="asset_register.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></a>
            <span class="ra-header__title">Asset Register</span>
          </div>

          <div class="ra-form-wrap">
            <h1 class="ra-form-title">Register Assets</h1>

            <!-- Asset Type & Name -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Asset Type <span class="ra-req">*</span></label>
                <div class="ra-combo" data-combo="assetType" id="raAssetTypeWrap">
                  <input class="ra-combo__input" id="raAssetType" placeholder="Select asset type" autocomplete="off">
                  <button type="button" class="ra-combo__clear" id="raAssetTypeClear" hidden aria-label="Clear">×</button>
                  <svg class="ra-combo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                  <div class="ra-combo__list"></div>
                </div>
              </div>
              <div class="ra-field">
                <label class="ra-label">Name <span class="ra-req">*</span></label>
                <input class="ra-input" id="raName" type="text" placeholder="Enter name">
              </div>
            </div>

            <!-- Description (Rich Text) -->
            <div class="ra-row">
              <div class="ra-field ra-field--full">
                <label class="ra-label">Description</label>
                <div class="ra-editor" id="raEditor">
                  <div class="ra-editor__toolbar">
                    <button class="ra-editor__btn" title="Undo">↺</button>
                    <button class="ra-editor__btn" title="Redo">↻</button>
                    <div style="position:relative;display:inline-block">
                      <button class="ra-editor__format" id="raFormatBtn">Paragraph <span style="font-size:10px">▾</span></button>
                      <div class="ra-editor__format-dropdown" id="raFormatDrop">
                        <div class="ra-editor__format-opt active" data-tag="p">Paragraph</div>
                        <div class="ra-editor__format-opt" data-tag="h1" style="font-size:22px;font-weight:700">Heading 1</div>
                        <div class="ra-editor__format-opt" data-tag="h2" style="font-size:18px;font-weight:700">Heading 2</div>
                        <div class="ra-editor__format-opt" data-tag="h3" style="font-size:15px;font-weight:700">Heading 3</div>
                        <div class="ra-editor__format-opt" data-tag="h4" style="font-size:14px;font-weight:600">Heading 4</div>
                        <div class="ra-editor__format-opt" data-tag="h5" style="font-size:12px;font-weight:600">Heading 5</div>
                        <div class="ra-editor__format-opt" data-tag="h6" style="font-size:11px;font-weight:600">Heading 6</div>
                        <div class="ra-editor__format-opt" data-tag="pre" style="font-family:monospace">Preformatted</div>
                      </div>
                    </div>
                    <div class="ra-editor__sep"></div>
                    <button class="ra-editor__btn" title="Bold" style="font-weight:700">B</button>
                    <button class="ra-editor__btn" title="Italic" style="font-style:italic">I</button>
                    <div class="ra-editor__sep"></div>
                    <button class="ra-editor__btn" title="Align Left">≡</button>
                    <button class="ra-editor__btn" title="Align Center">≡</button>
                    <button class="ra-editor__btn" title="Align Right">≡</button>
                    <div class="ra-editor__sep"></div>
                    <button class="ra-editor__btn" title="Unordered List">☰</button>
                    <button class="ra-editor__btn" title="Ordered List">☰</button>
                    <div class="ra-editor__sep"></div>
                    <button class="ra-editor__btn" title="Table">⊞</button>
                    <button class="ra-editor__btn" title="Code">&lt;/&gt;</button>
                  </div>
                  <div class="ra-editor__body" contenteditable="true" id="raEditorBody"></div>
                  <div class="ra-editor__footer"><span>p</span><span id="raWordCount">0 words</span></div>
                </div>
              </div>
            </div>

            <!-- Employee & Serial Number -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Employee</label>
                <div class="ra-combo" data-combo="employee" id="raEmployeeWrap">
                  <input class="ra-combo__input" id="raEmployee" placeholder="Select Employee" autocomplete="off">
                  <button type="button" class="ra-combo__clear" id="raEmployeeClear" hidden aria-label="Clear">×</button>
                  <svg class="ra-combo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                  <div class="ra-combo__list"></div>
                </div>
              </div>
              <div class="ra-field">
                <label class="ra-label">Serial Number</label>
                <input class="ra-input" id="raSerial" type="text" placeholder="Enter serial number">
              </div>
            </div>

            <!-- Purchase Date & Warranty Expiry Date -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Purchase Date</label>
                <div class="ra-date-wrap">
                  <input class="ra-input ra-date-input" id="raPurchaseDate" placeholder="Select date" readonly data-date="purchase">
                  <svg class="ra-date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                  <div class="ra-cal" id="calPurchase"></div>
                </div>
              </div>
              <div class="ra-field">
                <label class="ra-label">Warranty Expiry Date</label>
                <div class="ra-date-wrap">
                  <input class="ra-input ra-date-input" id="raWarrantyDate" placeholder="Select date" readonly data-date="warranty">
                  <svg class="ra-date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                  <div class="ra-cal" id="calWarranty"></div>
                </div>
              </div>
            </div>

            <!-- Purchase Cost & Current Value -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Purchase Cost <span class="ra-req">*</span></label>
                <input class="ra-input" id="raPurchaseCost" type="text" placeholder="Enter purchase cost">
              </div>
              <div class="ra-field">
                <label class="ra-label">Current Value <span class="ra-req">*</span></label>
                <input class="ra-input" id="raCurrentValue" type="text" placeholder="Enter current value">
              </div>
            </div>

            <!-- Salvage Value & Branch -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Salvage Value</label>
                <input class="ra-input" id="raSalvage" type="text" placeholder="Enter salvage value">
              </div>
              <div class="ra-field">
                <label class="ra-label">Branch <span class="ra-req">*</span></label>
                <div class="ra-combo" data-combo="branch">
                  <input class="ra-combo__input" placeholder="Select branch" value="Bluemon Wealth Management" autocomplete="off">
                  <svg class="ra-combo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                  <div class="ra-combo__list"></div>
                </div>
              </div>
            </div>

            <!-- Location -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Location</label>
                <select class="ra-select" id="raLocation"><option value="">Select Location</option><option>Office A</option><option>Office B</option><option>Warehouse</option></select>
              </div>
              <div class="ra-field"></div>
            </div>

            <!-- Depreciation Details Section -->
            <h2 class="ra-section-title">Depreciation Details</h2>

            <!-- Depreciation Method & Percentage -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Depreciation Method <span class="ra-req">*</span></label>
                <select class="ra-select" id="raDepMethod"><option value="">Select depreciation method</option><option>Straight Line</option><option>Declining Balance</option></select>
              </div>
              <div class="ra-field">
                <label class="ra-label">Depreciation Percentage <span class="ra-req">*</span></label>
                <input class="ra-input" id="raDepPct" type="text" placeholder="Enter depreciation percentage">
              </div>
            </div>

            <!-- Depreciation Frequency & Asset Life -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Depreciation Frequency <span class="ra-req">*</span></label>
                <select class="ra-select" id="raDepFreq"><option value="">Select depreciation frequency</option><option>Monthly</option><option>Quarterly</option><option>Semi-Annually</option><option>Annually</option></select>
              </div>
              <div class="ra-field">
                <label class="ra-label">Asset Life <span class="ra-req">*</span></label>
                <input class="ra-input" id="raAssetLife" type="text" placeholder="Enter asset life in months">
                <div class="ra-hint">Enter asset life in terms of months</div>
              </div>
            </div>

            <!-- Computation Type & Depreciation Start Date -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Computation Type <span class="ra-req">*</span></label>
                <select class="ra-select" id="raCompType"><option value="">Select computation type</option><option>Pro-Rata</option><option>Full Month</option></select>
              </div>
              <div class="ra-field">
                <label class="ra-label">Depreciation Start Date <span class="ra-req">*</span></label>
                <div class="ra-date-wrap">
                  <input class="ra-input ra-date-input" id="raDepStart" placeholder="Select date" readonly data-date="depstart">
                  <svg class="ra-date-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                  <div class="ra-cal" id="calDepstart"></div>
                </div>
              </div>
            </div>

            <!-- Status & Remarks -->
            <div class="ra-row">
              <div class="ra-field">
                <label class="ra-label">Status</label>
                <div class="ra-combo" data-combo="status" id="raStatusWrap">
                  <input class="ra-combo__input" id="raStatus" placeholder="Select status" autocomplete="off">
                  <svg class="ra-combo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                  <div class="ra-combo__list"></div>
                </div>
              </div>
              <div class="ra-field">
                <label class="ra-label">Remarks</label>
                <input class="ra-input" id="raRemarks" type="text" placeholder="Enter remarks">
              </div>
            </div>

            <!-- Buttons -->
            <div class="ra-btn-row">
              <button class="ra-btn-cancel" onclick="window.location.href='asset_register.html'">Cancel</button>
              <button class="ra-btn-submit">Submit</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/register-asset.js?v=2"></script>
</body>
</html>
