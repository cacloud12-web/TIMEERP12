<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transferred Work — TimeERP Marketing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/marketing-community-transferred.css?v=1">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="mct-top-checkout" id="crmTopCheckOutBtn">Check Out</button>
            <time class="mct-top-clock" id="mctTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn mct-top-icon" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn mct-top-icon" id="notifBtn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile">
                <span class="topbar__avatar">CA</span>
                <span class="topbar__profile-meta"><strong>CA CloudDesk</strong><span>Admin</span></span>
                <svg class="mct-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="marketing_community.html" class="dropdown__item"><strong>Community</strong><span>Back to community hub</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="mct-page">
          <header class="mct-header">
            <a class="mct-back" href="marketing_community.html" aria-label="Back to Community">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <span class="mct-crumb">Transferred Work</span>
          </header>

          <div class="mct-panel">
            <h1 class="mct-title">Transferred Work</h1>

            <div class="mct-tabs" role="tablist">
              <button type="button" class="mct-tab is-active" data-tab="pending" aria-selected="true">Pending</button>
              <button type="button" class="mct-tab" data-tab="previous" aria-selected="false">View Previous</button>
            </div>

            <div class="mct-filters">
              <span class="mct-filters__label">Filters:</span>
              <input type="text" class="mct-filter-input" id="mctSearchServices" placeholder="Search Services">
              <span class="mct-combo" data-list="person" id="mctPersonCombo">
                <input type="text" id="mctPersonFilter" placeholder="Assignee" autocomplete="off">
                <svg class="mct-combo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <div class="mct-combo__menu"></div>
              </span>
              <span class="mct-combo mct-combo--org" data-list="org">
                <input type="text" id="mctOrgFilter" placeholder="Assigned To Organizations" autocomplete="off">
                <svg class="mct-combo__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <div class="mct-combo__menu"></div>
              </span>
            </div>

            <div class="mct-table-wrap">
              <table class="mct-table">
                <thead id="mctTableHead"></thead>
                <tbody id="mctTableBody"></tbody>
              </table>
              <div class="mct-empty" id="mctEmpty">
                <svg viewBox="0 0 64 41" aria-hidden="true"><g transform="translate(0 1)" fill="none" fill-rule="evenodd"><ellipse fill="#f5f5f5" cx="32" cy="33" rx="32" ry="7"/><g fill-rule="nonzero" stroke="#d9d9d9"><path d="M55 12.76L44.854 1.258C44.367.474 43.656 0 42.907 0H21.093c-.749 0-1.46.474-1.947 1.257L9 12.761V22h46v-9.24z"/><path d="M41.613 15.931c0-1.605.994-2.93 2.227-2.931H55v18.137C55 33.26 53.68 35 52.05 35h-40.1C10.32 35 9 33.259 9 31.137V13h11.16c1.233 0 2.227 1.323 2.227 2.928v.022c0 1.605 1.005 2.901 2.237 2.901h14.752c1.232 0 2.237-1.308 2.237-2.913v-.007z" fill="#fafafa"/></g></g></svg>
                <p>No data</p>
              </div>
            </div>

            <footer class="mct-pagination" aria-label="Transferred work pagination">
              <div></div>
              <div class="mct-pagination__center">
                <button type="button" class="mct-page-nav" disabled aria-label="Previous page">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
                <input type="text" class="mct-page-input" value="1" readonly>
                <span class="mct-page-of">of <span id="mctPageTotal">1</span></span>
                <button type="button" class="mct-page-nav" disabled aria-label="Next page">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
              </div>
              <div class="mct-pagination__right"><span class="mct-count" id="mctCount">0 / 0</span></div>
            </footer>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/marketing-community-transferred.js?v=1"></script>
</body>
</html>
