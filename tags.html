<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags — TimeERP</title>
  <meta name="description" content="Organize clients, tasks and notes with tags.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/my-profile.css?v=46">
  <link rel="stylesheet" href="css/module-hub.css?v=3">
  <link rel="stylesheet" href="css/tags.css?v=1">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="shell-top-checkin is-checked-in is-orange" id="shellTopCheckInBtn">Check Out</button>
            <time class="shell-top-clock" id="shellTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn shell-top-icon" id="shellCalBtn" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn shell-top-icon" id="notifBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <a class="shell-account" id="profileBtn" href="my_profile.html" aria-label="Open profile">
              <span class="shell-account__org" aria-hidden="true"><img src="assets/favicon-mark.png" alt="" width="28" height="28"></span>
              <span class="shell-account__name">CA Cloud..</span>
              <span class="shell-account__user" aria-hidden="true"><img src="assets/favicon-mark.png" alt="" width="28" height="28"></span>
            </a>
          </div>
        </div>
      </header>
      <main class="main">
        <div class="mp-page mh-page tag-page">
          <nav class="mp-mod-nav" aria-label="Profile modules">
            <div class="mp-mod-nav__pills">
              <a href="my_profile.html" class="mp-mod-pill">Profile</a><a href="organization.html" class="mp-mod-pill">Organization</a><a href="hrms.html" class="mp-mod-pill">HRMS</a><a href="payroll.html" class="mp-mod-pill">Payroll</a><a href="import_utility.html" class="mp-mod-pill">Import Utility</a><a href="notification.html" class="mp-mod-pill">Notification</a><a href="settings.html" class="mp-mod-pill is-active" aria-current="page">Settings</a><a href="app_setup.html" class="mp-mod-pill">Setup</a>
            </div>
            <div class="mp-mod-nav__actions">
              <button type="button" class="mp-mod-icon-btn" aria-label="Trash" title="Trash">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 5h6"/><path d="M10 5V4h4v1"/><path d="M4.5 7.5h15"/><path d="M7 7.5l.9 12.2a1 1 0 0 0 1 .9h6.2a1 1 0 0 0 1-.9L17 7.5"/></svg>
              </button>
              <button type="button" class="mp-mod-icon-btn" aria-label="Unlock" title="Unlock">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/><path d="M16 11V7.5a4 4 0 0 0-7.6-1.7"/></svg>
              </button>
              <button type="button" class="mp-mod-icon-btn" aria-label="Logout" title="Logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 4a8 8 0 1 0 0 16"/><path d="M12 12h8"/><path d="M17.5 9l3 3-3 3"/></svg>
              </button>
            </div>
          </nav>

          <div class="tag-body">
            <div class="tag-title-row">
              <a class="tag-back" href="settings.html" aria-label="Back to Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
              </a>
              <h1 class="tag-title">Tag</h1>
              <div class="tag-toolbar">
                <label class="tag-search">
                  <input type="search" id="tagSearch" placeholder="Search tags" autocomplete="off" aria-label="Search tags">
                </label>
                <button type="button" class="tag-add-btn" id="tagAddBtn" aria-label="Add new tag">+</button>
              </div>
            </div>

            <div class="tag-card">
              <h2 class="tag-section-title">Tags</h2>
              <div class="tag-table-wrap">
                <table class="tag-table">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="tagTableBody"></tbody>
                </table>
              </div>
              <div class="tag-foot">
                <div class="tag-pager">
                  <button type="button" class="tag-pager__btn" id="tagPrev" aria-label="Previous page">&lsaquo;</button>
                  <span class="tag-pager__page" id="tagPageNum">1</span>
                  <span class="tag-pager__of">of <span id="tagPageTotal">2</span></span>
                  <button type="button" class="tag-pager__btn" id="tagNext" aria-label="Next page">&rsaquo;</button>
                </div>
                <div class="tag-count" id="tagCount">10 / 18</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="tag-modal" id="tagModal" hidden>
    <div class="tag-modal__overlay" data-tag-modal-close></div>
    <div class="tag-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="tagModalTitle">
      <div class="tag-modal__head">
        <h2 id="tagModalTitle">Add New Tag</h2>
        <button type="button" class="tag-modal__close" data-tag-modal-close aria-label="Close">&times;</button>
      </div>
      <form class="tag-modal__form" id="tagForm" novalidate>
        <div class="tag-modal__field">
          <label for="tagName">Tag Name <span class="tag-req">*</span></label>
          <input type="text" id="tagName" placeholder="Tag name" required>
        </div>
        <div class="tag-modal__colors">
          <div class="tag-modal__field">
            <label for="tagBgColor">Background Color <span class="tag-req">*</span></label>
            <input type="color" id="tagBgColor" value="#9ca3af" required>
          </div>
          <div class="tag-modal__field">
            <label for="tagTextColor">Text Color <span class="tag-req">*</span></label>
            <input type="color" id="tagTextColor" value="#ffffff" required>
          </div>
        </div>
        <div class="tag-modal__actions">
          <button type="button" class="tag-btn tag-btn--ghost" data-tag-modal-close>Cancel</button>
          <button type="submit" class="tag-btn tag-btn--primary" id="tagSubmitBtn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/tags.js?v=1"></script>
</body>
</html>
