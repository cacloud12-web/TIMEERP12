<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Clean TimeERP AI assistant icon -->
  <rect width="64" height="64" rx="14" fill="#F4FAFA"/>
  <!-- ears -->
  <rect x="8" y="24" width="7" height="14" rx="3.5" fill="#9CA3AF" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="49" y="24" width="7" height="14" rx="3.5" fill="#9CA3AF" stroke="#1F2937" stroke-width="1.5"/>
  <!-- head -->
  <rect x="14" y="16" width="36" height="32" rx="10" fill="#E5E7EB" stroke="#1F2937" stroke-width="1.75"/>
  <!-- top plate -->
  <path d="M18 22h28c0-4-4-7-14-7S18 18 18 22Z" fill="#9CA3AF" stroke="#1F2937" stroke-width="1.5"/>
  <!-- face screen -->
  <rect x="19" y="26" width="26" height="16" rx="6" fill="#F9FAFB" stroke="#1F2937" stroke-width="1.25"/>
  <!-- eyes -->
  <circle cx="26.5" cy="33.5" r="3.2" fill="#111827"/>
  <circle cx="37.5" cy="33.5" r="3.2" fill="#111827"/>
  <circle cx="27.4" cy="32.6" r="1" fill="#fff"/>
  <circle cx="38.4" cy="32.6" r="1" fill="#fff"/>
  <!-- smile -->
  <path d="M28 38.5c1.4 1.2 2.8 1.8 4 1.8s2.6-.6 4-1.8" stroke="#111827" stroke-width="1.5" stroke-linecap="round"/>
  <!-- antenna -->
  <path d="M22 16V10" stroke="#1F2937" stroke-width="1.75" stroke-linecap="round"/>
  <circle cx="22" cy="8" r="2.4" fill="#25B7A7" stroke="#1F2937" stroke-width="1.25"/>
  <!-- mic boom -->
  <path d="M52 31c4 2 5 7 2.5 11" stroke="#1F2937" stroke-width="1.75" stroke-linecap="round" fill="none"/>
  <circle cx="53.5" cy="43.5" r="2.3" fill="#25B7A7" stroke="#1F2937" stroke-width="1.25"/>
</svg>
