<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="../favicon.ico?v=13" sizes="any">
  <link rel="icon" href="../assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="../assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="../assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form 12B — TIME ERP HRMS</title>
  <meta name="description" content="Submit Form 12B previous employer details and annexure in TIME ERP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/form-12b.css?v=f12b2">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="../home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="../assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="f12-top-checkin is-in" id="f12TopCheckInBtn">Check In</button>
            <time class="f12-top-clock" id="f12TopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn f12-top-icon" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn f12-top-icon" id="notifBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
                <span class="topbar__badge">3</span>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile" aria-haspopup="true" aria-expanded="false">
                <span class="topbar__avatar">TE</span>
                <span class="topbar__profile-meta"><strong>Admin</strong><span>TimeERP</span></span>
                <svg class="f12-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="../home.html" class="dropdown__item"><strong>Go to home</strong><span>Module hub overview</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="f12-page" id="f12Page">
          <header class="f12-header">
            <a class="f12-back" href="../home.html#module/hrms" aria-label="Back to HRMS">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1 class="f12-title">Form 12B</h1>
          </header>

          <section class="f12-card" aria-label="12B Form">
            <a class="f12-decl-back" id="f12DeclBack" href="employee_declaration.html" hidden>&lt; Form 12B</a>
            <div class="f12-card-head">
              <h2 class="f12-card-title">12B Form</h2>
              <label class="f12-fy">
                <span class="f12-fy__label">Financial Year</span>
                <select id="f12FySelect" aria-label="Financial Year">
                  <option value="27-28">FY 27-28</option>
                  <option value="26-27" selected>FY 26-27</option>
                  <option value="25-26">FY 25-26</option>
                  <option value="24-25">FY 24-25</option>
                  <option value="23-24">FY 23-24</option>
                  <option value="22-23">FY 22-23</option>
                  <option value="21-22">FY 21-22</option>
                  <option value="20-21">FY 20-21</option>
                </select>
              </label>
            </div>

            <nav class="f12-stepper" id="f12Stepper" aria-label="Form 12B steps">
              <button type="button" class="f12-stepper__item is-active" data-step="0">
                <span class="f12-stepper__dot-wrap"><span class="f12-stepper__dot"></span><span class="f12-stepper__line"></span></span>
                <span class="f12-stepper__label">Previous Employer Details</span>
              </button>
              <button type="button" class="f12-stepper__item" data-step="1">
                <span class="f12-stepper__dot-wrap"><span class="f12-stepper__dot"></span><span class="f12-stepper__line"></span></span>
                <span class="f12-stepper__label">Annexure</span>
              </button>
              <button type="button" class="f12-stepper__item" data-step="2">
                <span class="f12-stepper__dot-wrap"><span class="f12-stepper__dot"></span></span>
                <span class="f12-stepper__label">Remarks And Declarations</span>
              </button>
            </nav>

            <!-- STEP 0 -->
            <div class="f12-panel is-active" data-panel="0" id="f12Panel0">
              <div class="f12-employer-list" id="f12EmployerList"></div>
              <div class="f12-actions f12-actions--center">
                <button type="button" class="f12-btn f12-btn--primary" id="f12AddEmployer">+ Add Employer</button>
                <button type="button" class="f12-btn f12-btn--primary" id="f12Next0">Next</button>
              </div>
            </div>

            <!-- STEP 1 -->
            <div class="f12-panel" data-panel="1" id="f12Panel1" hidden>
              <div class="f12-annexure-list" id="f12AnnexureList"></div>
              <div class="f12-actions f12-actions--center">
                <button type="button" class="f12-btn f12-btn--primary" id="f12AddAnnexure">+ Add Annexure</button>
              </div>
              <div class="f12-actions f12-actions--center">
                <button type="button" class="f12-btn f12-btn--primary" id="f12Prev1">Previous</button>
                <button type="button" class="f12-btn f12-btn--primary" id="f12Next1">Next</button>
              </div>
            </div>

            <!-- STEP 2 -->
            <div class="f12-panel" data-panel="2" id="f12Panel2" hidden>
              <div class="f12-remarks-block">
                <label class="f12-field-block">
                  <span class="f12-field-block__label">Accounts Remarks</span>
                  <textarea id="f12AccountsRemarks" rows="6" placeholder=""></textarea>
                </label>
                <div class="f12-field-block">
                  <span class="f12-field-block__label">Upload 12B Declaration</span>
                  <label class="f12-upload">
                    <input type="file" id="f12DeclarationUpload" accept="image/*,.pdf,.doc,.docx" hidden>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 16V7"/><path d="M8 11l4-4 4 4"/><path d="M5 19h14"/></svg>
                    <span class="f12-upload__label">Click to Upload</span>
                  </label>
                </div>
              </div>
              <div class="f12-actions f12-actions--center">
                <button type="button" class="f12-btn f12-btn--primary" id="f12Prev2">Previous</button>
                <button type="button" class="f12-btn f12-btn--teal" id="f12TempSave">Temporary Save</button>
              </div>
            </div>
          </section>

          <footer class="f12-app-footer" aria-label="App footer"></footer>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/form-12b.js?v=f12b2"></script>
</body>
</html>
