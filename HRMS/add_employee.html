<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="../favicon.ico?v=13" sizes="any">
  <link rel="icon" href="../assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="../assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="../assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Employee — TIME ERP HRMS</title>
  <meta name="description" content="Add a new employee in TIME ERP HRMS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/add-employee.css?v=save1">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="../home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="../assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn" id="notifBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
                <span class="topbar__badge">3</span>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <button type="button" class="topbar__icon-btn" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile" aria-haspopup="true" aria-expanded="false">
                <span class="topbar__avatar">TE</span>
                <span class="topbar__profile-meta"><strong>Admin</strong><span>TimeERP</span></span>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="../home.html" class="dropdown__item"><strong>Go to home</strong><span>Module hub overview</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="ae-page" id="aePage">
          <header class="ae-header">
            <div class="ae-header__left">
              <a class="ae-back" href="viewemployee.html" aria-label="Back to View Employee">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
              </a>
              <h1 class="ae-title">Add Employee</h1>
            </div>
            <button type="button" class="ae-btn ae-btn--designation" id="aeDesignationBtn">+ Designation</button>
          </header>

          <nav class="ae-stepper" id="aeStepper" aria-label="Add employee steps">
            <button type="button" class="ae-stepper__item is-active" data-step="0">
              <span class="ae-stepper__dot-wrap"><span class="ae-stepper__dot"></span><span class="ae-stepper__line"></span></span>
              <span class="ae-stepper__label">Employee Details</span>
            </button>
            <button type="button" class="ae-stepper__item" data-step="1">
              <span class="ae-stepper__dot-wrap"><span class="ae-stepper__dot"></span><span class="ae-stepper__line"></span></span>
              <span class="ae-stepper__label">Permissions</span>
            </button>
            <button type="button" class="ae-stepper__item" data-step="2">
              <span class="ae-stepper__dot-wrap"><span class="ae-stepper__dot"></span><span class="ae-stepper__line"></span></span>
              <span class="ae-stepper__label">Additional Details</span>
            </button>
            <button type="button" class="ae-stepper__item" data-step="3">
              <span class="ae-stepper__dot-wrap"><span class="ae-stepper__dot"></span><span class="ae-stepper__line"></span></span>
              <span class="ae-stepper__label">Bank Details</span>
            </button>
            <button type="button" class="ae-stepper__item" data-step="4">
              <span class="ae-stepper__dot-wrap"><span class="ae-stepper__dot"></span><span class="ae-stepper__line"></span></span>
              <span class="ae-stepper__label">Emergency Contacts</span>
            </button>
            <button type="button" class="ae-stepper__item" data-step="5">
              <span class="ae-stepper__dot-wrap"><span class="ae-stepper__dot"></span><span class="ae-stepper__line"></span></span>
              <span class="ae-stepper__label">Upload Documents</span>
            </button>
          </nav>

          <form id="aeForm" onsubmit="return false;">
            <!-- Step 0: Employee Details -->
            <section class="ae-panel is-active" data-panel="0" id="aePanel0">
              <div class="ae-avatar-block">
                <label class="ae-avatar" id="aeAvatarPreview" for="aeProfileFile" title="Upload Profile Picture">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <circle cx="12" cy="8" r="3.5"/>
                    <path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/>
                  </svg>
                </label>
                <label class="ae-avatar-label" for="aeProfileFile">Upload Profile Picture</label>
                <input type="file" id="aeProfileFile" accept="image/*" hidden>
              </div>

              <div class="ae-grid">
                <div class="ae-col">
                  <div class="ae-field">
                    <span class="ae-field__label">Employment Type</span>
                    <div class="ae-field__control ae-radios">
                      <label class="ae-radio"><input type="radio" name="employmentType" value="Employee" checked> Employee</label>
                      <label class="ae-radio"><input type="radio" name="employmentType" value="Freelancers"> Freelancers</label>
                    </div>
                  </div>
                  <div class="ae-field" data-required="name">
                    <label class="ae-field__label" for="aeName">Name <span class="req">*</span></label>
                    <div class="ae-field__control"><input class="ae-input" type="text" id="aeName" name="name" placeholder="Name"></div>
                  </div>
                  <div class="ae-field" data-required="mobile1">
                    <label class="ae-field__label" for="aeMobile1">Mobile No 1 <span class="req">*</span></label>
                    <div class="ae-field__control"><input class="ae-input" type="tel" id="aeMobile1" name="mobile1" placeholder="Mobile No 1"></div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeMobile2">Mobile No 2</label>
                    <div class="ae-field__control"><input class="ae-input" type="tel" id="aeMobile2" name="mobile2" placeholder="Mobile No 2"></div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeDepartment">Department</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeDepartment" name="department">
                        <option value="">Department</option>
                        <option>HR</option>
                        <option>Finance</option>
                        <option>Operations</option>
                        <option>IT</option>
                        <option>Sales</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <span class="ae-field__label">Disability</span>
                    <div class="ae-field__control">
                      <label class="ae-switch">
                        <input type="checkbox" name="disability" data-toggle-label>
                        <span class="ae-switch__track"><span class="ae-switch__knob"></span></span>
                        <span class="ae-switch__text">NO</span>
                      </label>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeDob">DOB</label>
                    <div class="ae-field__control">
                      <div class="ae-date">
                        <input class="ae-input" type="text" id="aeDob" name="dob" placeholder="DOB">
                        <span class="ae-date__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
                      </div>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeProbation">Probation Period</label>
                    <div class="ae-field__control"><input class="ae-input" type="text" id="aeProbation" name="probation" placeholder="Enter Probation Period"></div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeOffice">Office</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeOffice" name="office">
                        <option value="">Select Office</option>
                        <option>Head Office</option>
                        <option>Branch Office</option>
                        <option>Remote</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeTeam">Team</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeTeam" name="team">
                        <option value="">Select Team</option>
                        <option>Core</option>
                        <option>Support</option>
                        <option>Delivery</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field ae-field--top">
                    <label class="ae-field__label" for="aeCurrentAddress">Current Address</label>
                    <div class="ae-field__control"><textarea class="ae-textarea" id="aeCurrentAddress" name="currentAddress" rows="3" placeholder="Current Address"></textarea></div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeNotice">Notice Period</label>
                    <div class="ae-field__control"><input class="ae-input" type="text" id="aeNotice" name="notice" placeholder="Enter Notice Period"></div>
                  </div>
                  <div class="ae-field">
                    <span class="ae-field__label">Allow Mobile Attendance</span>
                    <div class="ae-field__control">
                      <label class="ae-switch">
                        <input type="checkbox" name="mobileAttendance" data-toggle-label>
                        <span class="ae-switch__track"><span class="ae-switch__knob"></span></span>
                        <span class="ae-switch__text">NO</span>
                      </label>
                    </div>
                  </div>
                  <div class="ae-field">
                    <span class="ae-field__label">Allow Outside Radius</span>
                    <div class="ae-field__control">
                      <label class="ae-switch">
                        <input type="checkbox" name="outsideRadius" data-toggle-label>
                        <span class="ae-switch__track"><span class="ae-switch__knob"></span></span>
                        <span class="ae-switch__text">NO</span>
                      </label>
                    </div>
                  </div>
                </div>

                <div class="ae-col">
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeOrganization">Organization</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeOrganization" name="organization">
                        <option selected>TimeErp Demo</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeEmpCode">Employee Code</label>
                    <div class="ae-field__control"><input class="ae-input" type="text" id="aeEmpCode" name="empCode" placeholder="Employee Code"></div>
                  </div>
                  <div class="ae-field" data-required="email">
                    <label class="ae-field__label" for="aeEmail">Email Id <span class="req">*</span></label>
                    <div class="ae-field__control"><input class="ae-input" type="email" id="aeEmail" name="email" placeholder="Email Id"></div>
                  </div>
                  <div class="ae-field" data-required="manager">
                    <label class="ae-field__label" for="aeManager">Manager <span class="req">*</span></label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeManager" name="manager">
                        <option value="">Manager</option>
                        <option>Saurabh Bhardwaj</option>
                        <option>Admin</option>
                        <option>HR Manager</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <span class="ae-field__label">Marital Status</span>
                    <div class="ae-field__control ae-radios">
                      <label class="ae-radio"><input type="radio" name="maritalStatus" value="Single" checked> Single</label>
                      <label class="ae-radio"><input type="radio" name="maritalStatus" value="Married"> Married</label>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeEducation">Education Qualification</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeEducation" name="education">
                        <option value="">Select education qualification</option>
                        <option>High School</option>
                        <option>Graduate</option>
                        <option>Post Graduate</option>
                        <option>CA</option>
                        <option>CS</option>
                        <option>Other</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeJoining">Joining Date</label>
                    <div class="ae-field__control">
                      <div class="ae-date">
                        <input class="ae-input" type="text" id="aeJoining" name="joiningDate" value="30/07/2026" placeholder="dd/mm/yyyy">
                        <span class="ae-date__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
                      </div>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeBranch">Branch</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeBranch" name="branch">
                        <option selected>TimeErp Demo</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeShift">Shift</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeShift" name="shift">
                        <option selected>Normal Routine</option>
                        <option>Morning</option>
                        <option>Evening</option>
                        <option>Night</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeGender">Gender</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeGender" name="gender">
                        <option selected>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field ae-field--top">
                    <label class="ae-field__label" for="aePermanentAddress">Permanent Address</label>
                    <div class="ae-field__control"><textarea class="ae-textarea" id="aePermanentAddress" name="permanentAddress" rows="3" placeholder="Permanent Address"></textarea></div>
                  </div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeStatus">Status</label>
                    <div class="ae-field__control">
                      <select class="ae-select" id="aeStatus" name="status">
                        <option selected>Active</option>
                        <option>Inactive</option>
                      </select>
                    </div>
                  </div>
                  <div class="ae-field">
                    <span class="ae-field__label">Allow Desktop Attendance</span>
                    <div class="ae-field__control">
                      <label class="ae-switch">
                        <input type="checkbox" name="desktopAttendance" data-toggle-label>
                        <span class="ae-switch__track"><span class="ae-switch__knob"></span></span>
                        <span class="ae-switch__text">NO</span>
                      </label>
                    </div>
                  </div>
                  <div class="ae-field">
                    <span class="ae-field__label">Allow Face Recognition</span>
                    <div class="ae-field__control">
                      <label class="ae-switch">
                        <input type="checkbox" name="faceRecognition" data-toggle-label>
                        <span class="ae-switch__track"><span class="ae-switch__knob"></span></span>
                        <span class="ae-switch__text">NO</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <!-- Step 1: Permissions -->
            <section class="ae-panel" data-panel="1" id="aePanel1">
              <div class="ae-perm-head">
                <h2>Permissions</h2>
                <button type="button" class="ae-perm-sets" id="aeDesignationSets">
                  Designation Sets
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
              </div>
              <div class="ae-perm-list" id="aePermList"></div>
            </section>

            <!-- Step 2: Additional Details -->
            <section class="ae-panel" data-panel="2" id="aePanel2">
              <div class="ae-form-narrow ae-form-narrow--additional">
                <div class="ae-field"><label class="ae-field__label" for="aeEpf">EPF NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeEpf" name="epf" placeholder="EPF NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeUan">UAN NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeUan" name="uan" placeholder="UAN NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeEsic">ESIC NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeEsic" name="esic" placeholder="ESIC NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeAadhaar">Aadhaar NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeAadhaar" name="aadhaar" placeholder="Aadhaar NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeEid">EID NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeEid" name="eid" placeholder="EID NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aePan">PAN NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aePan" name="pan" placeholder="PAN NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeDl">DL NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeDl" name="dl" placeholder="DL NO."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aePassport">Passport NO. :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aePassport" name="passport" placeholder="Passport NO."></div></div>
                <div class="ae-field">
                  <label class="ae-field__label" for="aeBlood">Blood Group :</label>
                  <div class="ae-field__control">
                    <select class="ae-select" id="aeBlood" name="bloodGroup">
                      <option value="">Select Blood Group</option>
                      <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                      <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
                    </select>
                  </div>
                </div>
                <div class="ae-field"><label class="ae-field__label" for="aeInstagram">Instagram Url :</label><div class="ae-field__control"><input class="ae-input" type="url" id="aeInstagram" name="instagram" placeholder="Instagram Url"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeFacebook">Facebook Url :</label><div class="ae-field__control"><input class="ae-input" type="url" id="aeFacebook" name="facebook" placeholder="Facebook Url"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeOtherSocial">Other Social Media Url :</label><div class="ae-field__control"><input class="ae-input" type="url" id="aeOtherSocial" name="otherSocial" placeholder="Other Social Media Url"></div></div>
              </div>

              <div class="ae-pro-box">
                <div class="ae-section-bar">PROFESSIONAL DETAILS</div>
                <div class="ae-form-narrow ae-form-narrow--inset ae-form-narrow--pro">
                  <div class="ae-field"><label class="ae-field__label" for="aeMembership">Membership No :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeMembership" name="membershipNo" placeholder="Membership No"></div></div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeMembershipDate">Membership Date :</label>
                    <div class="ae-field__control">
                      <div class="ae-date">
                        <input class="ae-input" type="text" id="aeMembershipDate" name="membershipDate" placeholder="dd/mm/yyyy">
                        <span class="ae-date__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
                      </div>
                    </div>
                  </div>
                  <div class="ae-field"><label class="ae-field__label" for="aeFrn">FRN No :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeFrn" name="frnNo" placeholder="FRN No"></div></div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aeFrnDate">FRN Date :</label>
                    <div class="ae-field__control">
                      <div class="ae-date">
                        <input class="ae-input" type="text" id="aeFrnDate" name="frnDate" placeholder="dd/mm/yyyy">
                        <span class="ae-date__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
                      </div>
                    </div>
                  </div>
                  <div class="ae-field"><label class="ae-field__label" for="aeLinkedin">LinkedIn URL :</label><div class="ae-field__control"><input class="ae-input" type="url" id="aeLinkedin" name="linkedin" placeholder="https://linkedin.com/in/"></div></div>
                  <div class="ae-field">
                    <label class="ae-field__label" for="aePassing">Date of Passing (CA/CS) :</label>
                    <div class="ae-field__control">
                      <div class="ae-date">
                        <input class="ae-input" type="text" id="aePassing" name="passingDate" placeholder="dd/mm/yyyy">
                        <span class="ae-date__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>
                      </div>
                    </div>
                  </div>
                  <div class="ae-field"><label class="ae-field__label" for="aeExperience">Experience for Practicing Professional :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeExperience" name="experience" placeholder="No of Years"></div></div>
                </div>
              </div>
            </section>

            <!-- Step 3: Bank Details -->
            <section class="ae-panel" data-panel="3" id="aePanel3">
              <div class="ae-form-narrow">
                <div class="ae-field"><label class="ae-field__label" for="aeBankName">Bank Name</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeBankName" name="bankName" placeholder="Bank Name"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeBranchName">Branch Name</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeBranchName" name="branchName" placeholder="Branch Name"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeAccountHolder">Account Holder Name</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeAccountHolder" name="accountHolder" placeholder="Account Holder Name"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeAccountNo">Bank Account No.</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeAccountNo" name="accountNo" placeholder="Bank Account No."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeIfsc">IFSC Code</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeIfsc" name="ifsc" placeholder="IFSC Code"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeIban">IBAN No.</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeIban" name="iban" placeholder="IBAN No."></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeSwift">Swift Code</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeSwift" name="swift" placeholder="Swift Code"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeMicr">MICR Code</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeMicr" name="micr" placeholder="MICR Code"></div></div>
              </div>
            </section>

            <!-- Step 4: Emergency Contacts -->
            <section class="ae-panel" data-panel="4" id="aePanel4">
              <div class="ae-form-narrow ae-form-narrow--emergency">
                <div class="ae-field"><label class="ae-field__label" for="aeEmerName">Name :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeEmerName" name="emerName" placeholder="Name"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeEmerMobile1">Mobile 1 :</label><div class="ae-field__control"><input class="ae-input" type="tel" id="aeEmerMobile1" name="emerMobile1" placeholder="Mobile 1"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeEmerMobile2">Mobile 2 :</label><div class="ae-field__control"><input class="ae-input" type="tel" id="aeEmerMobile2" name="emerMobile2" placeholder="Mobile 2"></div></div>
                <div class="ae-field"><label class="ae-field__label" for="aeRelationship">Relationship :</label><div class="ae-field__control"><input class="ae-input" type="text" id="aeRelationship" name="relationship" placeholder="Relationship"></div></div>
                <div class="ae-field ae-field--top"><label class="ae-field__label" for="aeEmerAddress">Address :</label><div class="ae-field__control"><textarea class="ae-textarea" id="aeEmerAddress" name="emerAddress" rows="4" placeholder="Address"></textarea></div></div>
              </div>
            </section>

            <!-- Step 5: Upload Documents -->
            <section class="ae-panel" data-panel="5" id="aePanel5">
              <div class="ae-docs">
                <div class="ae-docs__row">
                  <div class="ae-docs__label">Documents :</div>
                  <label class="ae-docs__drop" for="aeDocFile">
                    <span class="ae-docs__drop-text">+ Add Document</span>
                  </label>
                  <input type="file" id="aeDocFile" multiple hidden>
                </div>
                <div class="ae-docs__list" id="aeDocList"></div>
              </div>
            </section>

            <div class="ae-footer" id="aeFooter">
              <button type="button" class="ae-btn ae-btn--ghost" id="aePrevBtn" hidden>Previous</button>
              <button type="button" class="ae-btn ae-btn--primary" id="aeNextBtn">Next</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <div class="ae-modal" id="aeDesigModal" hidden>
    <div class="ae-modal__backdrop" data-desig-close></div>
    <div class="ae-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="aeDesigTitle">
      <div class="ae-modal__head">
        <h2 class="ae-modal__title" id="aeDesigTitle">Set Designation</h2>
        <button type="button" class="ae-modal__close" data-desig-close aria-label="Close">&times;</button>
      </div>
      <div class="ae-modal__body">
        <div class="ae-modal-row">
          <label class="ae-modal-row__label" for="aeDesigName">Designation <span class="ae-req">*</span></label>
          <div class="ae-modal-row__control">
            <input class="ae-input" type="text" id="aeDesigName" placeholder="Designation" autocomplete="off">
          </div>
        </div>
        <div class="ae-modal-row">
          <label class="ae-modal-row__label" for="aeDesigDesc">Description :</label>
          <div class="ae-modal-row__control">
            <input class="ae-input" type="text" id="aeDesigDesc" placeholder="Description" autocomplete="off">
          </div>
        </div>
        <div class="ae-modal-row ae-modal-row--perms">
          <div class="ae-modal-row__label">Permissions :</div>
          <div class="ae-modal-row__control">
            <div class="ae-perm-list ae-perm-list--modal" id="aeDesigPermList"></div>
          </div>
        </div>
      </div>
      <div class="ae-modal__foot">
        <button type="button" class="ae-btn ae-btn--desig-save" id="aeDesigSave">Save</button>
      </div>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/add-employee.js?v=desig1"></script>
</body>
</html>
