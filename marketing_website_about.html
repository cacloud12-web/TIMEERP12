<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About — TimeERP Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/marketing-website-about.css?v=1">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="mwa-top-checkout" id="crmTopCheckOutBtn">Check Out</button>
            <time class="mwa-top-clock" id="mwaTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn mwa-top-icon" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn mwa-top-icon" id="notifBtn" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile">
                <span class="topbar__avatar">CA</span>
                <span class="topbar__profile-meta"><strong>CA CloudDesk</strong><span>Admin</span></span>
                <svg class="mwa-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="marketing_website.html" class="dropdown__item"><strong>Website</strong><span>Back to website hub</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="mwa-page">
          <header class="mwa-header">
            <a class="mwa-back" href="marketing_website.html" aria-label="Back to Website">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <span class="mwa-crumb">About</span>
          </header>

          <div class="mwa-panel">
            <div class="mwa-tabs" role="tablist">
              <button type="button" class="mwa-tab is-active" data-tab="about-us" aria-selected="true">About Us</button>
              <button type="button" class="mwa-tab" data-tab="why-us" aria-selected="false">Why Us</button>
              <button type="button" class="mwa-tab" data-tab="mission" aria-selected="false">Mission &amp; Vision</button>
              <button type="button" class="mwa-tab" data-tab="team" aria-selected="false">Team Members</button>
            </div>

            <!-- About Us -->
            <div class="mwa-tab-panel" id="mwaPanelAbout" data-panel="about-us">
              <h1 class="mwa-section-title">About Section</h1>
              <form class="mwa-form" id="mwaAboutForm">
                <div class="mwa-row">
                  <label class="mwa-label" for="mwaAboutHeading">Heading<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaAboutHeading">
                </div>
                <div class="mwa-row mwa-row--top">
                  <label class="mwa-label" for="mwaAboutDesc">Description</label>
                  <textarea class="mwa-textarea" id="mwaAboutDesc" placeholder="Description"></textarea>
                </div>
                <div class="mwa-row">
                  <span class="mwa-label">Image</span>
                  <button type="button" class="mwa-upload" data-upload="about">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V8"/><path d="M8 12l4-4 4 4"/><path d="M4 20h16"/></svg>
                    <span>Click to Upload</span>
                  </button>
                  <input type="file" id="mwaAboutImage" accept="image/*" hidden>
                </div>
                <button type="submit" class="mwa-save">Save</button>
              </form>
            </div>

            <!-- Why Us -->
            <div class="mwa-tab-panel" id="mwaPanelWhy" data-panel="why-us" hidden>
              <h1 class="mwa-section-title">Why Us Section</h1>
              <form class="mwa-form" id="mwaWhyForm">
                <div class="mwa-row">
                  <label class="mwa-label" for="mwaWhyHeading">Heading<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyHeading">
                </div>
                <div class="mwa-row mwa-row--points">
                  <label class="mwa-label" for="mwaWhyPoint1">Point 1<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyPoint1">
                  <label class="mwa-label" for="mwaWhyDesc1">Description<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyDesc1">
                </div>
                <div class="mwa-row mwa-row--points">
                  <label class="mwa-label" for="mwaWhyPoint2">Point 2<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyPoint2">
                  <label class="mwa-label" for="mwaWhyDesc2">Description<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyDesc2">
                </div>
                <div class="mwa-row mwa-row--points">
                  <label class="mwa-label" for="mwaWhyPoint3">Point 3<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyPoint3">
                  <label class="mwa-label" for="mwaWhyDesc3">Description<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyDesc3">
                </div>
                <div class="mwa-row mwa-row--points">
                  <label class="mwa-label" for="mwaWhyPoint4">Point 4<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyPoint4">
                  <label class="mwa-label" for="mwaWhyDesc4">Description<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaWhyDesc4">
                </div>
                <button type="submit" class="mwa-save">Save</button>
              </form>
            </div>

            <!-- Mission & Vision -->
            <div class="mwa-tab-panel" id="mwaPanelMission" data-panel="mission" hidden>
              <h1 class="mwa-section-title">Mission And Vision</h1>
              <form class="mwa-form" id="mwaMissionForm">
                <div class="mwa-row">
                  <label class="mwa-label" for="mwaMissionHeading">Mission Heading<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaMissionHeading">
                </div>
                <div class="mwa-row mwa-row--top">
                  <label class="mwa-label" for="mwaMissionDesc">Mission Description</label>
                  <textarea class="mwa-textarea" id="mwaMissionDesc" placeholder="Description"></textarea>
                </div>
                <div class="mwa-row">
                  <label class="mwa-label" for="mwaVisionHeading">Vision Heading<span class="mwa-req">*</span></label>
                  <input class="mwa-input" type="text" id="mwaVisionHeading">
                </div>
                <div class="mwa-row mwa-row--top">
                  <label class="mwa-label" for="mwaVisionDesc">Vision Description</label>
                  <textarea class="mwa-textarea" id="mwaVisionDesc" placeholder="Description"></textarea>
                </div>
                <button type="submit" class="mwa-save">Save</button>
              </form>
            </div>

            <!-- Team Members -->
            <div class="mwa-tab-panel" id="mwaPanelTeam" data-panel="team" hidden>
              <div class="mwa-team-head">
                <h1 class="mwa-section-title">Team</h1>
                <button type="button" class="mwa-plus" id="mwaAddMemberBtn" aria-label="Add member">+</button>
              </div>
              <div class="mwa-table-wrap" id="mwaTeamWrap">
                <table class="mwa-table">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Designation</th>
                      <th>Image</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="mwaTeamBody"></tbody>
                </table>
                <div class="mwa-empty">
                  <svg viewBox="0 0 64 41" aria-hidden="true"><g transform="translate(0 1)" fill="none"><ellipse fill="#f5f5f5" cx="32" cy="33" rx="32" ry="7"/><g stroke="#d9d9d9"><path d="M55 12.76L44.854 1.258C44.367.474 43.656 0 42.907 0H21.093c-.749 0-1.46.474-1.947 1.257L9 12.761V22h46v-9.24z"/><path d="M41.613 15.931c0-1.605.994-2.93 2.227-2.931H55v18.137C55 33.26 53.68 35 52.05 35h-40.1C10.32 35 9 33.259 9 31.137V13h11.16c1.233 0 2.227 1.323 2.227 2.928v.022c0 1.605 1.005 2.901 2.237 2.901h14.752c1.232 0 2.237-1.308 2.237-2.913v-.007z" fill="#fafafa"/></g></g></svg>
                  <p>No data</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Member modal -->
  <div class="mwa-modal-scrim" id="mwaMemberModal" hidden>
    <div class="mwa-modal" role="dialog" aria-labelledby="mwaMemberTitle">
      <div class="mwa-modal__head">
        <h2 id="mwaMemberTitle">Add Member</h2>
        <button type="button" class="mwa-modal__close" data-close="member" aria-label="Close">&times;</button>
      </div>
      <form class="mwa-modal__body" id="mwaMemberForm">
        <div class="mwa-field">
          <label for="mwaMemberName">Name<span class="mwa-req">*</span></label>
          <input type="text" id="mwaMemberName" placeholder="Name" required>
        </div>
        <div class="mwa-field">
          <label for="mwaMemberDesig">Designation<span class="mwa-req">*</span></label>
          <input type="text" id="mwaMemberDesig" placeholder="Designation" required>
        </div>
        <div class="mwa-field">
          <label>Image</label>
          <button type="button" class="mwa-upload" data-upload="member">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V8"/><path d="M8 12l4-4 4 4"/><path d="M4 20h16"/></svg>
            <span>Click to Upload</span>
          </button>
          <input type="file" id="mwaMemberImage" accept="image/*" hidden>
        </div>
        <label class="mwa-check">
          <input type="checkbox" id="mwaMemberLead">
          <span>Is Team Lead?</span>
        </label>
        <button type="submit" class="mwa-save">Save</button>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/marketing-website-about.js?v=2"></script>
</body>
</html>
