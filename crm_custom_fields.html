<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Custom Fields | TimeERP CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/crm-custom-fields.css?v=9">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Focus search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>

    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="crm-top-checkout" id="crmTopCheckOutBtn">Check Out</button>
            <time class="crm-top-clock" id="crmTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn crm-top-icon" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn crm-top-icon" id="notifBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
                <span class="topbar__badge">3</span>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__profile" id="profileBtn" aria-label="Profile" aria-haspopup="true" aria-expanded="false">
                <span class="topbar__avatar">CA</span>
                <span class="topbar__profile-meta"><strong>CA CloudDesk</strong><span>Admin</span></span>
                <svg class="crm-profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="dropdown" id="profileDropdown" role="menu" aria-label="Profile menu">
                <div class="dropdown__title">Account</div>
                <a href="home.html" class="dropdown__item"><strong>Go to home</strong><span>Module hub overview</span></a>
              </div>
            </div>
          </div>
        </div>
      </header>

      <main class="main">
        <div class="cf-page">
          <div class="cf-nav">
            <a class="cf-back" href="home.html#module/crm" aria-label="Back to Profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <span class="cf-nav__label">Profile</span>
          </div>

          <section class="cf-card" aria-labelledby="cfTitle">
            <div class="cf-card__head">
              <h1 class="cf-title" id="cfTitle">Add Custom Fields</h1>
              <div class="cf-type" id="cfTypeDropdown">
                <input class="cf-type__input" id="cfTypeInput" type="text" value="Customer" autocomplete="off" aria-label="Field group">
                <div class="cf-type__menu" role="listbox">
                  <div class="cf-type__item is-active" role="option">Customer</div>
                  <div class="cf-type__item" role="option">Task</div>
                  <div class="cf-type__item" role="option">Custom Fields</div>
                </div>
              </div>
              <button class="cf-add-btn" type="button" id="cfAddFieldBtn">
                <span class="cf-add-btn__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                </span>
                Add Field
              </button>
            </div>

            <div class="cf-fields" id="cfFields"></div>

            <div class="cf-card__foot">
              <button class="cf-btn cf-btn--save" type="button" id="cfSaveBtn">Save Changes</button>
              <button class="cf-btn cf-btn--reset" type="button" id="cfResetBtn">Reset</button>
            </div>
          </section>

          <footer class="cf-app-footer" aria-label="App footer"></footer>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script>
    (function () {
      var clock = document.getElementById('crmTopClock');
      function tickClock() {
        if (!clock) return;
        var now = new Date();
        clock.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        clock.setAttribute('datetime', now.toISOString());
      }
      tickClock();
      setInterval(tickClock, 30000);

      var dropdown = document.getElementById('cfTypeDropdown');
      var input = document.getElementById('cfTypeInput');
      var items = Array.prototype.slice.call(dropdown.querySelectorAll('.cf-type__item'));
      var fieldsWrap = document.getElementById('cfFields');

      function showAllTypeItems() {
        items.forEach(function (item) { item.style.display = ''; });
      }
      function closeType() { dropdown.classList.remove('is-open'); }
      function openType() {
        showAllTypeItems();
        dropdown.classList.add('is-open');
      }

      input.addEventListener('focus', openType);
      input.addEventListener('click', function (e) {
        e.stopPropagation();
        openType();
      });
      input.addEventListener('input', function () {
        var q = input.value.trim().toLowerCase();
        var exact = items.some(function (item) { return item.textContent.toLowerCase() === q; });
        items.forEach(function (item) {
          item.style.display = !q || exact || item.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
        });
        dropdown.classList.add('is-open');
      });
      document.addEventListener('click', function (e) {
        if (!dropdown.contains(e.target)) closeType();
      });
      var addBtn = document.getElementById('cfAddFieldBtn');
      var FIELD_TYPES = ['Dropdown', 'DOB', 'Text', 'Checkbox', 'Mobile', 'Email'];

      function currentGroup() { return (input.value || 'Customer').trim(); }
      function syncAddVisibility() {
        addBtn.classList.toggle('is-hidden', fieldsWrap.children.length > 0);
      }
      function bindKindDropdown(kind) {
        var kindInput = kind.querySelector('.cf-kind__input');
        var kindItems = Array.prototype.slice.call(kind.querySelectorAll('.cf-kind__item'));
        function closeKind() { kind.classList.remove('is-open'); }
        function openKind() { kind.classList.add('is-open'); }
        kindInput.addEventListener('focus', openKind);
        kindInput.addEventListener('click', function (e) {
          e.stopPropagation();
          openKind();
        });
        kindItems.forEach(function (item) {
          item.addEventListener('mousedown', function (e) {
            e.preventDefault();
            kindInput.value = item.textContent;
            kindItems.forEach(function (el) { el.classList.remove('is-active'); });
            item.classList.add('is-active');
            closeKind();
          });
        });
        document.addEventListener('click', function (e) {
          if (!kind.contains(e.target)) closeKind();
        });
      }
      function fieldRow(opts) {
        opts = opts || {};
        var label = opts.label || 'Label Field';
        var required = !!opts.required;
        var showUnique = opts.unique !== false && currentGroup() !== 'Task';
        var wrap = document.createElement('div');
        wrap.className = 'cf-field-wrap';
        wrap.innerHTML =
          '<div class="cf-field">' +
            '<div class="cf-field__label-row">' +
              '<input class="cf-field__label" type="text" value="' + label.replace(/"/g, '&quot;') + '" aria-label="Field label">' +
              '<span class="cf-field__edit" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 5.3l3.5 3.5"/><path d="M4 20l4.1-.9L18.9 8.3a1.8 1.8 0 00-2.5-2.5L5.6 16.6 4 20z"/></svg></span>' +
            '</div>' +
            '<div class="cf-field__row">' +
              '<div class="cf-kind">' +
                '<input class="cf-kind__input" type="text" value="text" autocomplete="off" aria-label="Field type">' +
                '<div class="cf-kind__menu" role="listbox">' +
                  FIELD_TYPES.map(function (t) { return '<div class="cf-kind__item' + (t === 'Text' ? ' is-active' : '') + '" role="option">' + t + '</div>'; }).join('') +
                '</div>' +
              '</div>' +
              '<button class="cf-meta" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 10.5v6M12 7.5h.01"/></svg> Add Details</button>' +
              '<button class="cf-meta" type="button" data-duplicate><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 012-2h10"/></svg> Duplicate</button>' +
              '<label class="cf-toggle">Required <span class="cf-switch"><input type="checkbox"' + (required ? ' checked' : '') + '><span></span></span></label>' +
              (showUnique ? '<label class="cf-toggle">Unique <span class="cf-switch"><input type="checkbox"><span></span></span></label>' : '') +
              '<button class="cf-field__delete" type="button" aria-label="Delete field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6.5 7l.8 12.2A1.5 1.5 0 008.8 20.5h6.4a1.5 1.5 0 001.5-1.3L17.5 7"/><path d="M10 11v6M14 11v6"/></svg></button>' +
            '</div>' +
          '</div>' +
          '<button class="cf-plus" type="button" aria-label="Add field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>';
        bindKindDropdown(wrap.querySelector('.cf-kind'));
        wrap.querySelector('.cf-field__edit').addEventListener('click', function () {
          wrap.querySelector('.cf-field__label').focus();
        });
        wrap.querySelector('.cf-field__delete').addEventListener('click', function () {
          wrap.remove();
          syncAddVisibility();
        });
        return wrap;
      }
      function addField() {
        fieldsWrap.appendChild(fieldRow());
        syncAddVisibility();
      }
      function loadGroup(name) {
        input.value = name;
        items.forEach(function (el) { el.classList.toggle('is-active', el.textContent === name); });
        fieldsWrap.innerHTML = '';
        if (name === 'Task') fieldsWrap.appendChild(fieldRow({ label: 'ACK NO', required: false, unique: false }));
        else if (name === 'Custom Fields') fieldsWrap.appendChild(fieldRow({ label: 'Label Field', required: false, unique: false }));
        syncAddVisibility();
      }

      items.forEach(function (item) {
        item.addEventListener('mousedown', function (e) {
          e.preventDefault();
          loadGroup(item.textContent);
          closeType();
        });
      });
      fieldsWrap.addEventListener('click', function (e) {
        if (e.target.closest('.cf-plus') || e.target.closest('[data-duplicate]')) {
          e.preventDefault();
          addField();
        }
      });
      addBtn.addEventListener('click', addField);
      document.getElementById('cfResetBtn').addEventListener('click', function () {
        loadGroup(currentGroup() || 'Customer');
        closeType();
      });
      document.getElementById('cfSaveBtn').addEventListener('click', function () {
        if (window.DashboardShell && DashboardShell.toast) DashboardShell.toast('Saved', 'Custom fields updated.');
      });
    })();
  </script>
</body>
</html>
