<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.ico?v=13" sizes="any">
  <link rel="shortcut icon" href="favicon.ico?v=13" sizes="any">
  <link rel="icon" href="assets/favicon-32.png?v=13" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/favicon-mark.png?v=13" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-mark.png?v=13">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes — TimeERP</title>
  <meta name="description" content="Create, view, and manage notes in TimeERP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HRMS/css/dashboard-shell.css?v=sidebar-light1">
  <link rel="stylesheet" href="css/my-notes-page.css?v=2">
</head>
<body>
  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="app-shell" id="top">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <div class="sidebar__brand">
        <a href="home.html" class="sidebar__brand-logo" aria-label="TimeERP home">
          <img src="assets/logo-nav.svg" alt="TimeERP" width="196" height="48">
        </a>
      </div>
      <div class="sidebar__toolbar" role="group" aria-label="Search and create">
        <button type="button" class="sidebar__search-btn" id="sidebarSearchToggle" aria-label="Search routes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button type="button" class="sidebar__create-btn" id="sidebarCreate">
          <span class="sidebar__create-icon" aria-hidden="true">+</span>
          <span>Create</span>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebarList" aria-label="Module navigation"></nav>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <div class="topbar__inner">
          <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Open modules menu">☰</button>
          <div class="topbar__search" role="search">
            <input type="search" id="globalSearch" placeholder="Search..." autocomplete="off" aria-label="Search">
          </div>
          <div class="topbar__actions">
            <button type="button" class="shell-top-checkin" id="shellTopCheckInBtn">Check In</button>
            <time class="shell-top-clock" id="shellTopClock" datetime="">--:--</time>
            <button type="button" class="topbar__icon-btn shell-top-icon" id="shellCalBtn" aria-label="Calendar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
            </button>
            <div class="topbar__menu" style="position:relative">
              <button type="button" class="topbar__icon-btn shell-top-icon" id="notifBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M12 3a6 6 0 00-6 6v3.5l-1.5 2.5h15L18 12.5V9a6 6 0 00-6-6z"/><path d="M10 19a2 2 0 004 0"/></svg>
              </button>
              <div class="dropdown" id="notifDropdown" role="menu" aria-label="Notifications">
                <div class="dropdown__title">Notifications</div>
                <div id="notifList"></div>
              </div>
            </div>
            <a class="shell-account" id="profileBtn" href="my_profile.html" aria-label="Open profile">
              <span class="shell-account__org" aria-hidden="true"><img src="assets/favicon-mark.png" alt="" width="28" height="28"></span>
              <span class="shell-account__name">Ca Ram Kumar</span>
              <span class="shell-account__user" aria-hidden="true"><img src="assets/favicon-mark.png" alt="" width="28" height="28"></span>
            </a>
          </div>
        </div>
      </header>
      <main class="main">
        <div class="mn-page">
          <div class="mn-card">
            <div class="mn-tabs" role="tablist" aria-label="Notes">
              <button type="button" class="mn-tab" role="tab" data-mn-tab="note" aria-selected="false">Note</button>
              <button type="button" class="mn-tab is-active" role="tab" data-mn-tab="view" aria-selected="true">View Note</button>
              <button type="button" class="mn-tab" role="tab" data-mn-tab="recurring" aria-selected="false">Recurring Note</button>
              <button type="button" class="mn-tab" role="tab" data-mn-tab="view-recurring" aria-selected="false">View Recurring Note</button>
            </div>

            <div class="mn-pane" data-mn-pane="note" role="tabpanel">
              <form class="mn-form" id="mnNoteForm">
                <div class="mn-form__grid">
                  <div class="mn-field">
                    <label for="mnTitle">Title</label>
                    <input type="text" id="mnTitle" placeholder="Enter title">
                  </div>
                  <div class="mn-field">
                    <label for="mnPriority">Priority</label>
                    <select id="mnPriority">
                      <option value="">Select priority</option>
                      <option>High</option>
                      <option>Medium</option>
                      <option>Low</option>
                    </select>
                  </div>
                  <div class="mn-field mn-field--full">
                    <label for="mnBody">Note</label>
                    <textarea id="mnBody" placeholder="Enter note"></textarea>
                  </div>
                  <div class="mn-field">
                    <label for="mnClient">Client</label>
                    <input type="text" id="mnClient" placeholder="Select client">
                  </div>
                  <div class="mn-field">
                    <label for="mnUrl">URL</label>
                    <input type="url" id="mnUrl" placeholder="https://">
                  </div>
                </div>
                <div class="mn-form__actions">
                  <button type="button" class="mn-btn mn-btn--ghost" id="mnCancelBtn">Cancel</button>
                  <button type="button" class="mn-btn mn-btn--primary" id="mnSaveBtn">Save</button>
                </div>
              </form>
            </div>

            <div class="mn-pane is-active" data-mn-pane="view" role="tabpanel">
              <div class="mn-filters">
                <span class="mn-filters__label">Filters :</span>
                <select class="mn-select" aria-label="Status">
                  <option value="">Status</option>
                  <option>Open</option>
                  <option>Completed</option>
                </select>
                <div class="mn-date-range" aria-label="Date range">
                  <em>Start date</em>
                  <span aria-hidden="true">→</span>
                  <em>End date</em>
                  <span class="mn-date-range__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
                  </span>
                </div>
              </div>
              <div class="mn-table-wrap">
                <table class="mn-table">
                  <thead>
                    <tr>
                      <th>S. No.</th>
                      <th>Created Date</th>
                      <th>Priority</th>
                      <th>Note</th>
                      <th>Client</th>
                      <th>URL</th>
                      <th>Title</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td colspan="9">
                        <div class="mn-empty">
                          <div class="mn-empty__icon">
                            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                              <path d="M16 24h32v28H16z"/><path d="M24 24V18a8 8 0 0116 0v6"/>
                            </svg>
                          </div>
                          <div>No data</div>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="mn-foot">
                <button type="button" class="mn-foot__btn" disabled aria-label="Previous page">‹</button>
                <span class="mn-foot__info">1 of 1</span>
                <button type="button" class="mn-foot__btn" disabled aria-label="Next page">›</button>
                <span class="mn-foot__count">0 / 0</span>
              </div>
            </div>

            <div class="mn-pane" data-mn-pane="recurring" role="tabpanel">
              <div class="mn-form">
                <div class="mn-form__grid">
                  <div class="mn-field mn-field--full">
                    <label for="mnRecurringTitle">Recurring Note Title</label>
                    <input type="text" id="mnRecurringTitle" placeholder="Enter recurring note title">
                  </div>
                  <div class="mn-field mn-field--full">
                    <label for="mnRecurringBody">Note</label>
                    <textarea id="mnRecurringBody" placeholder="Enter recurring note"></textarea>
                  </div>
                </div>
                <div class="mn-form__actions">
                  <button type="button" class="mn-btn mn-btn--primary" id="mnRecurringSaveBtn">Save</button>
                </div>
              </div>
            </div>

            <div class="mn-pane" data-mn-pane="view-recurring" role="tabpanel">
              <div class="mn-filters">
                <span class="mn-filters__label">Filters :</span>
                <select class="mn-select" id="mnRecurringStatusFilter" aria-label="Status">
                  <option value="">Status</option>
                  <option>Active</option>
                  <option>Paused</option>
                </select>
              </div>
              <div class="mn-table-wrap">
                <table class="mn-table">
                  <thead>
                    <tr>
                      <th>S. No.</th>
                      <th>Created Date</th>
                      <th>Priority</th>
                      <th>Note</th>
                      <th>Client</th>
                      <th>Title</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="mnRecurringTableBody"></tbody>
                </table>
              </div>
              <div class="mn-foot">
                <button type="button" class="mn-foot__btn" id="mnRecurringPrev" disabled aria-label="Previous page">‹</button>
                <span class="mn-foot__info"><span id="mnRecurringPageNum">1</span> of <span id="mnRecurringPageTotal">1</span></span>
                <button type="button" class="mn-foot__btn" id="mnRecurringNext" disabled aria-label="Next page">›</button>
                <span class="mn-foot__count" id="mnRecurringCount">0 / 0</span>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="HRMS/js/dashboard-shell.js?v=unlock1"></script>
  <script src="js/my-notes-page.js?v=2"></script>
</body>
</html>
